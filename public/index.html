<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>poe2lab 장비 설계</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="top">
  <h1>poe2lab <span>장비 설계</span></h1>
  <div id="modeBadge" class="badge"></div>
</header>
<main class="layout">
  <form id="form" class="panel">
    <section>
      <h2>리그 · 데이터</h2>
      <label>리그 <select name="league" id="league"></select></label>
      <label>거래 데이터
        <select name="mode" id="mode">
          <option value="live">실시간 (공식 trade2)</option>
          <option value="mock">데모 (가짜 매물)</option>
        </select>
      </label>
      <label>매물 상태
        <select name="status">
          <option value="securable">즉시 구매 (은신처 이동 가능)</option>
          <option value="online">온라인 판매자 (귓속말)</option>
        </select>
      </label>
    </section>

    <section>
      <h2>빌드</h2>
      <label>직업(전직)</label>
      <div class="combo" id="classCombo"><input name="className" autocomplete="off" required placeholder="예: 데드아이, ㄷㄷㅇ, Deadeye" /></div>
      <label>주력 스킬 3종</label>
      <div class="combo skill"><input name="skill0" autocomplete="off" required placeholder="스킬 1 (예: 번개 화살)" /></div>
      <div class="combo skill"><input name="skill1" autocomplete="off" placeholder="스킬 2" /></div>
      <div class="combo skill"><input name="skill2" autocomplete="off" placeholder="스킬 3" /></div>
      <p class="hint" id="profileHint">빌드 프로필은 현재 <b>샘플 데이터</b>입니다. 같은 형식 JSON 을 올려 교체할 수 있어요.</p>
      <label class="file">프로필 JSON 업로드 <input type="file" id="profileFile" accept=".json,application/json" /></label>
    </section>

    <section>
      <h2>목표 능력치 <small>(장비 합계)</small></h2>
      <label class="check"><input type="checkbox" name="autoTargets" checked /> 비운 칸은 같은 빌드 유저들의 일반적인 수치로 채우기</label>
      <div class="grid2" id="targets"></div>
      <details>
        <summary>저항 계산 설정</summary>
        <div class="grid2">
          <label>원소 저항 페널티 <input type="number" name="elementalPenalty" value="-60" /></label>
          <label>캠페인 저항 보너스 <input type="number" name="campaignBonus" value="20" /></label>
          <label>트리 등 화염 <input type="number" name="otherFire" value="0" /></label>
          <label>트리 등 냉기 <input type="number" name="otherCold" value="0" /></label>
          <label>트리 등 번개 <input type="number" name="otherLight" value="0" /></label>
          <label>트리 등 카오스 <input type="number" name="otherChaos" value="0" /></label>
        </div>
        <p class="hint" id="resHint"></p>
      </details>
    </section>

    <section>
      <h2>예산 · 타협</h2>
      <label>총 예산 (비우면 무제한)</label>
      <div class="grid2 budget">
        <label>엑잘티드 <input type="number" name="budgetEx" min="0" step="1" placeholder="0" /></label>
        <label>디바인 <input type="number" name="budgetDiv" min="0" step="0.1" placeholder="0" /></label>
      </div>
      <p class="hint" id="budgetHint"></p>
      <label class="check"><input type="checkbox" name="compromise" checked /> 비싼 옵션은 스스로 타협</label>
      <label>타협 기준: 옵션 포함 시 가격이 <input type="number" name="ratio" value="3" min="1" step="0.5" class="inline" />배 이상이면 제외</label>
      <label>검색 깊이
        <select name="depth">
          <option value="normal">보통 (정확, 느림)</option>
          <option value="quick">빠르게 (요청 적음)</option>
        </select>
      </label>
    </section>

    <button type="submit" id="go">최적 장비 세트 찾기</button>
  </form>

  <section id="out" class="results">
    <div class="empty">왼쪽에서 빌드와 목표치를 정하고 검색하세요.<br /><small>실시간 모드는 GGG 레이트 리밋 때문에 1~5분 걸릴 수 있습니다.</small></div>
  </section>
</main>
<template id="slotTpl">
  <article class="slot">
    <header><span class="slotname"></span><span class="price"></span></header>
    <div class="itemname"></div>
    <ul class="mods"></ul>
    <div class="seller"></div>
    <div class="notes"></div>
    <div class="actions"></div>
  </article>
</template>
<script type="module" src="app.js"></script>
</body>
</html>
